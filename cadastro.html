<body>
    <!-- Parte esquerda: Painel com blur e formulário -->
    <div class="left-section">
        <div class="form-panel">
            <h2>Cadastrar-se</h2>
            <form action="#" method="post">
                <div class="form-group">
                    <input type="text" id="name" name="name" placeholder="Nome Completo" required>
                </div>
                <div class="form-group">
                    <input type="email" id="email" name="email" placeholder="E-mail" required>
                </div>
                <div class="form-group">
                    <input type="password" id="password" name="password" placeholder="Senha" required>
                </div>
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">Concordo com os Termos e Condições</label>
                </div>
                <button type="submit" class="btn-primary">Cadastrar-se</button>

                <div class="links">
                <a href="login.html">Já tem uma conta? Entrar</a>
            </div>
            
            </form>
            </div>
            
        </div>
    </div>
    
    <!-- Parte direita: Imagem de fundo com texto -->
    <div class="right-section">
        <div class="text-overlay">
            <h1>Junte-se</h1>
            <p>ao Bioceans e explore as maravilhas do oceano.</p>
        </div>
    </div>
</body>
